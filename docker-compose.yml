services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-tahrirchi}
    volumes:
      # Ma'lumotlar shu volume'da saqlanadi — rebuild/qayta ishga tushirishda O'CHMAYDI
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-tahrirchi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Bot konteyneri bazaga 'db' xizmati orqali ulanadi (.env dagi PG_HOST ustidan yoziladi)
      PG_HOST: db
      PG_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
